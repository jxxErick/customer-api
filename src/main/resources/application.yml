spring:
  application:
    name: customer-api
  datasource:
    url: jdbc:h2:mem:customers;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

integration:
  viacep:
    base-url: https://viacep.com.br/ws
    connect-timeout: 3s
    read-timeout: 5s
    cache-ttl: 1h

idempotency:
  ttl: 24h
  cleanup-interval: PT1H

cors:
  # comma-separated; the Angular dev server by default
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
